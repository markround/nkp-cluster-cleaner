name: Create Release

# Triggers and stage ordering live in pipeline.yml, which only reaches this
# stage for a tag push, so GITHUB_REF below is always refs/tags/<version>.
on:
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: extract_version
        run: |
          # Remove 'v' prefix if present
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # The tag is checked against __version__ by the version stage in
      # pipeline.yml, which runs before anything is published.

      - name: Generate release body
        id: release_body
        run: |
          # Create release body with installation instructions
          echo "## Installation" > release_body.md
          echo "" >> release_body.md
          echo "### Docker Image" >> release_body.md
          echo '```bash' >> release_body.md
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.extract_version.outputs.version }}" >> release_body.md
          echo '```' >> release_body.md
          echo "" >> release_body.md
          echo "### Helm Chart" >> release_body.md
          echo '```bash' >> release_body.md
          echo "helm install nkp-cluster-cleaner oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/helm --version ${{ steps.extract_version.outputs.version }}" >> release_body.md
          echo '```' >> release_body.md

      # The image no longer needs polling for: pipeline.yml runs this stage only
      # after the Docker build has pushed it successfully.

      - name: Download packaged Helm chart
        uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: release-assets

      # Creates the release and attaches the chart in one step. The previous
      # actions/create-release and actions/upload-release-asset pair is archived.
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.extract_version.outputs.tag_name }}
          name: "Release ${{ steps.extract_version.outputs.tag_name }}"
          body_path: release_body.md
          draft: false
          prerelease: ${{ contains(steps.extract_version.outputs.version, '-') || contains(steps.extract_version.outputs.version, 'alpha') || contains(steps.extract_version.outputs.version, 'beta') || contains(steps.extract_version.outputs.version, 'rc') }}
          files: release-assets/*.tgz
          fail_on_unmatched_files: true

      - name: Output release information
        run: |
          echo "## 🎉 Release Created Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.extract_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ steps.extract_version.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release URL:** ${{ steps.create_release.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Available Artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "- 🐳 Docker Image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.extract_version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- ⚓ Helm Chart: \`oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/helm:${{ steps.extract_version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
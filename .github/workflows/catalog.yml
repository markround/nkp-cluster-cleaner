name: Catalog Packaging

# Triggers and stage ordering live in pipeline.yml. This used to chain off a
# workflow_run of the Helm workflow, which checked out the default branch rather
# than the tag; as a called workflow it now runs against the tagged commit.
on:
  workflow_call:

jobs:
  validate-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate catalog repository
        run: |
          docker run --rm \
            --entrypoint /opt/nkp/nkp \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            mesosphere/nkp-distributor-linux:v2.18.0 \
            validate catalog-repository

  # Note the use of /catalog as the volume path, this is because the
  # nkp create catalog commands use the current working directory as
  # a project name.
  create-catalog-bundle:
    runs-on: ubuntu-latest
    needs: validate-catalog
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create catalog bundle
        run: |
          docker run --rm \
            --entrypoint /opt/nkp/nkp \
            -v ${{ github.workspace }}:/catalog \
            -w /catalog \
            mesosphere/nkp-distributor-linux:v2.18.0 \
            create catalog-bundle --output-file nkp-cluster-cleaner.tar

      - name: Upload catalog bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: catalog-bundle
          path: nkp-cluster-cleaner.tar
          retention-days: 1

  push-catalog-bundle:
    runs-on: ubuntu-latest
    needs: create-catalog-bundle
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download catalog bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: catalog-bundle

      - name: Push catalog bundle
        run: |
          docker run --rm \
            --entrypoint /opt/nkp/nkp \
            -v ${{ github.workspace }}:/catalog \
            -w /catalog \
            mesosphere/nkp-distributor-linux:v2.18.0 \
            push bundle --bundle nkp-cluster-cleaner.tar \
              --to-registry ghcr.io/markround \
              --to-registry-username ${{ github.actor }} \
              --to-registry-password ${{ secrets.GITHUB_TOKEN }}
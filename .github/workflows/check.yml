name: Python Checks

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - 'ruff.toml'
      - '.github/workflows/check.yml'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test the declared floor as well as the version the image ships with.
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: pytest --cov=nkp_cluster_cleaner --cov-report=term-missing

  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A non-editable install is what the container uses. This catches a missing
      # __init__.py or an undeclared template/static directory, which an editable
      # install silently papers over.
      - name: Install from a built wheel
        run: |
          pip install build
          python -m build --wheel
          pip install dist/*.whl

      - name: Verify the CLI and packaged data files are present
        run: |
          nkp-cluster-cleaner --help
          python - <<'EOF'
          import importlib.resources as resources

          files = resources.files("nkp_cluster_cleaner")
          for name in ("templates/base.html", "templates/clusters.html"):
              assert (files / name).is_file(), f"missing from the wheel: {name}"
          print("packaged data files OK")
          EOF

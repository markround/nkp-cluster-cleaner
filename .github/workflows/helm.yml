name: Publish Helm Chart

# Triggers and stage ordering live in pipeline.yml, which only reaches this
# stage for a tag push, so GITHUB_REF below is always refs/tags/<version>.
on:
  workflow_call:

env:
  CHART_PATH: charts/nkp-cluster-cleaner

jobs:
  publish-oci-helm-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: extract_version
        run: |
          # Remove 'v' prefix if present
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # The tag is checked against Chart.yaml by the version stage in
      # pipeline.yml, which runs before anything is published.

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.13.0'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push OCI Helm chart
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"

          # --version stamps the tag onto the package, so a prerelease tag
          # publishes 0.15.0-rc1 rather than overwriting the real 0.15.0 chart.
          # Without it helm names the file after Chart.yaml and the push below
          # would look for a tarball that does not exist.
          helm package ${{ env.CHART_PATH }} --version "$VERSION" --destination ./oci-charts

          # Push the chart to GHCR as OCI artifact
          CHART_FILE="nkp-cluster-cleaner-${VERSION}.tgz"
          OCI_REGISTRY="ghcr.io/${{ github.repository_owner }}/helm"

          echo "Pushing OCI chart to $OCI_REGISTRY:$VERSION"

          helm push "./oci-charts/$CHART_FILE" "oci://$OCI_REGISTRY"

          echo "OCI Helm chart pushed successfully"

      # Hand the exact tarball that was pushed to the registry on to the release
      # stage, so the release asset and the OCI artifact cannot drift apart.
      - name: Upload packaged chart for the release stage
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: ./oci-charts/*.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Output OCI publication details
        run: |
          echo "## 📦 OCI Helm Chart Published Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Chart:** nkp-cluster-cleaner" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.extract_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ghcr.io/${{ github.repository_owner }}/helm" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation Commands:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "helm install nkp-cluster-cleaner oci://ghcr.io/${{ github.repository_owner }}/helm --version ${{ steps.extract_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY